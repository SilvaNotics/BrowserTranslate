name: Release extension
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Keep the image version aligned with the pinned @playwright/test version.
    container: mcr.microsoft.com/playwright:v1.65.0-noble
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npm run zip
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: .output/browser-translate-*-chrome.zip
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification
          path: |
            artifacts/*.png
            artifacts/*.json
            test-results/
  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: .output
      - name: Publish developer-mode package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp .output/browser-translate-*-chrome.zip "BrowserTranslate-${RELEASE_TAG}-chrome.zip"
          gh release create "$RELEASE_TAG" "BrowserTranslate-${RELEASE_TAG}-chrome.zip" --verify-tag --title "译境 ${RELEASE_TAG}" --notes-file CHANGELOG.md
